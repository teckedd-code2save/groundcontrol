name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 10m
          script: |
            set -eu
            cd /opt/groundcontrol || exit 1
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              git fetch --depth=1 origin main
              git reset --hard origin/main
            fi
            # Sync docker-compose.yml from repo so infra changes (ports, env, volumes) propagate
            curl -sfL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml" \
              -o docker-compose.yml || echo "docker-compose.yml sync skipped (using existing)"
            docker compose pull || {
              echo "Image pull failed; building web image from synced source on the VPS." >&2
              docker compose build web
            }
            docker compose run --rm --no-deps web npx prisma migrate deploy --schema /app/db/schema.prisma
            docker compose up -d --remove-orphans
            for i in $(seq 1 30); do
              if docker compose ps web | grep -q healthy; then
                break
              fi
              sleep 2
            done
            docker compose ps web | grep -q healthy
            LOCAL_ENDPOINT="$(docker compose port web 3000 | head -n 1)"
            curl -fsS --max-time 10 "http://${LOCAL_ENDPOINT}/api/vps/stats" >/dev/null
            PUBLIC_URL="${{ vars.GC_PUBLIC_URL }}"
            PUBLIC_URL="${PUBLIC_URL:-https://groundcontrol.serendepify.com/login}"
            for i in $(seq 1 12); do
              if curl -k -fsS --max-time 15 "$PUBLIC_URL" >/dev/null; then
                echo "Public smoke passed: $PUBLIC_URL"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Public smoke failed: $PUBLIC_URL" >&2
                docker compose ps >&2 || true
                docker compose logs --tail=120 web >&2 || true
                exit 1
              fi
              sleep 5
            done

            # ChatGPT MCP discovery smoke: OAuth may protect tool invocation,
            # but action discovery itself must remain readable and complete.
            MCP_URL="${GC_MCP_URL:-https://groundcontrol.serendepify.com/mcp}"
            MCP_TOOLS="$(curl -k -fsS --max-time 15 -X POST "$MCP_URL" \
              -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":"tools-smoke","method":"tools/list","params":{}}')"
            printf '%s' "$MCP_TOOLS" | grep -q '"deployment.list"'
            printf '%s' "$MCP_TOOLS" | grep -q '"outputSchema"'
            printf '%s' "$MCP_TOOLS" | grep -q '"securitySchemes"'

            MCP_DISCOVER="$(curl -k -fsS --max-time 15 -X POST "$MCP_URL" \
              -H 'Content-Type: application/json' \
              -H 'MCP-Protocol-Version: 2026-07-28' \
              -H 'Mcp-Method: server/discover' \
              --data '{"jsonrpc":"2.0","id":"discover-smoke","method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}')"
            printf '%s' "$MCP_DISCOVER" | grep -q '"supportedVersions"'
            printf '%s' "$MCP_DISCOVER" | grep -q '"2026-07-28"'
            echo "MCP discovery smoke passed: $MCP_URL"

            docker compose ps
            docker compose logs --tail=80 web
            docker logout ghcr.io
            docker system prune -f || echo "Docker prune skipped; another prune may already be running"
