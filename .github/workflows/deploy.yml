name: GroundControl independent supervised upgrade
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gc-upgrade-diagnosis-20261109
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Upgrade through host systemd with verified rollback
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 12m
          script: |
            set -eu
            test "$(hostname -s)" = serendepify-vps
            test "$(id -u)" = 0
            test "$(cat /proc/1/comm)" = systemd
            gc_dir=/opt/gc-upgrade-staging/25202bc-20261109-systemd
            gc_unit=gc-upgrade-25202bc-20261109-systemd
            umask 077
            mkdir "$gc_dir"
            mkdir "$gc_dir/docker"
            cp -p /opt/gc-upgrade-staging/25202bc-20261109-r2/supervise-upgrade.py "$gc_dir/supervise-upgrade.py"
            test "$(sha256sum "$gc_dir/supervise-upgrade.py" | cut -d ' ' -f 1)" = f0a1f03dcd4b08dd1176d12ca968f50b5df1c3b3c017993a168463101ca5ac06
            cat > "$gc_dir/launch.py" <<'PY'
            import os,pathlib,sys,json
            unit="gc-upgrade-25202bc-20261109-systemd.service"
            group=pathlib.Path("/proc/self/cgroup").read_text()
            if os.getppid()!=1 or ("/system.slice/"+unit) not in group:
             raise RuntimeError("Refusing upgrade outside independently owned systemd service")
            print(json.dumps({"supervisorParent":os.getppid(),"supervisorCgroup":group.strip()}),flush=True)
            os.execv("/usr/bin/python3",["/usr/bin/python3","/opt/gc-upgrade-staging/25202bc-20261109-systemd/supervise-upgrade.py",sys.argv[1]])
            PY
            systemd-run --unit="$gc_unit" --property=Type=exec --property=UMask=0077 --property="StandardOutput=append:$gc_dir/upgrade.log" --property="StandardError=append:$gc_dir/upgrade.log" --setenv="DOCKER_CONFIG=$gc_dir/docker" /usr/bin/python3 "$gc_dir/launch.py" ghcr.io/teckedd-code2save/groundcontrol@sha256:839199545a59aaae397e78819a51ff0e8437b7b45da8412d9a4a9fac087a0e1c
            for gc_i in $(seq 1 180); do
             gc_state=$(systemctl show "$gc_unit" --property=ActiveState --value)
             case "$gc_state" in inactive|failed) break;; esac
             sleep 3
            done
            systemctl show "$gc_unit" --property=ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,ControlGroup
            cat "$gc_dir/upgrade.log"
            test "$(systemctl show "$gc_unit" --property=Result --value)" = success
            test "$(systemctl show "$gc_unit" --property=ExecMainStatus --value)" = 0
            docker inspect groundcontrol-web --format 'IMAGE={{.Config.Image}} HEALTH={{.State.Health.Status}}'
            python3 -c 'import json,pathlib; p=sorted(pathlib.Path("/opt/groundcontrol/backups").glob("supervised-*"),reverse=True)[0]; r=json.loads((p/"result.json").read_text()); print(str(p)); print(json.dumps(r)); assert r["status"]=="upgrade_complete"; assert r["revision"]=="25202bc11fc09b41c6d8a88c5b22721ca0e9a38c"'
            
