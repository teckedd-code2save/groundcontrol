name: GroundControl approved OAuth repair
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: gc-oauth-upgrade-20261111
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Apply approved repair with private backup and rollback
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 12m
          script: |
            set -eu
            test "$(hostname -s)" = serendepify-vps
            test "$(id -u)" = 0
            test "$(cat /proc/1/comm)" = systemd
            umask 077
            gc_stage=/opt/gc-upgrade-staging/e57f9bd-20261111-systemd
            gc_unit=gc-upgrade-e57f9bd-20261111
            test -f "$gc_stage/preflight.json"
            test ! -e "$gc_stage/result.json"
            test ! -e "$gc_stage/supervise-oauth-upgrade.py"
            gc_active=$(systemctl list-units --state=active,activating 'gc-upgrade-*.service' --no-legend --plain)
            test -z "$gc_active"
            if pgrep -f '[s]upervise-upgrade.py' >/dev/null; then echo 'UPGRADE_BLOCKED_EXISTING_SUPERVISOR'; exit 1; fi
            python3 - <<'SCRIPT'
            import base64,hashlib,os,pathlib
            code=base64.b64decode('')
            assert hashlib.sha256(code).hexdigest()=='616c3f534cf49f4cc419fcf3d87c4e6429ecab3696cdc70a891a87ac4d8ebfe2'
            compile(code,'supervise-oauth-upgrade.py','exec')
            path=pathlib.Path('/opt/gc-upgrade-staging/e57f9bd-20261111-systemd/supervise-oauth-upgrade.py')
            fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
            with os.fdopen(fd,'wb') as f: f.write(code); f.flush(); os.fsync(f.fileno())
            SCRIPT
            mkdir "$gc_stage/docker"
            trap 'rm -f "$gc_stage/docker/config.json"; rmdir "$gc_stage/docker" 2>/dev/null || true' EXIT
            printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker --config "$gc_stage/docker" login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null 2>&1
            if ! docker --config "$gc_stage/docker" pull ghcr.io/teckedd-code2save/groundcontrol@sha256:2bf1b55f1158c822fdc5d2ca5f54d23e7efd3cd19d1787727d65028a17769153 > "$gc_stage/pull.log" 2>&1; then echo 'UPGRADE_IMAGE_PULL_BLOCKED'; exit 1; fi
            systemd-run --unit="$gc_unit" --property=Type=exec --property=UMask=0077 --property="StandardOutput=append:$gc_stage/upgrade.log" --property="StandardError=append:$gc_stage/upgrade.log" /usr/bin/python3 "$gc_stage/supervise-oauth-upgrade.py" >/dev/null 2>&1
            for gc_i in $(seq 1 180); do
              gc_state=$(systemctl show "$gc_unit" --property=ActiveState --value)
              case "$gc_state" in inactive|failed) break;; esac
              sleep 3
            done
            python3 - <<'RESULT'
            import json,pathlib,sys
            p=pathlib.Path('/opt/gc-upgrade-staging/e57f9bd-20261111-systemd/result.json')
            if not p.exists(): print('UPGRADE_DID_NOT_START; PRIVATE_DIAGNOSIS_REQUIRED'); sys.exit(1)
            result=json.loads(p.read_text())
            status=result.get('status')
            allowed={'preflight_complete','stopping','backing_up','backup_complete','replacing','verifying','upgrade_complete','rolling_back','upgrade_rolled_back','manual_recovery_required'}
            print('UPGRADE_RESULT='+status if status in allowed else 'UPGRADE_RESULT=unknown')
            if status!='upgrade_complete': sys.exit(1)
            assert result.get('revision')=='e57f9bdfb200d2e8be905c49c1358d39bce25c08'
            assert result.get('backupComplete') is True and result.get('publicOAuthChallengeVerified') is True
            print('BACKUP_COMPLETE; PUBLIC_OAUTH_CHALLENGE_VERIFIED')
            RESULT
