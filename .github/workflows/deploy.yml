name: GroundControl upgrade diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gc-upgrade-diagnosis-20261109
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read upgrade and container status
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 30s
          command_timeout: 2m
          script: |
            set -eu
            test "$(hostname -s)" = serendepify-vps
            cat /opt/gc-upgrade-staging/25202bc-20261109-public-followup/upgrade.log
            ps -p "$(cat /opt/gc-upgrade-staging/25202bc-20261109-public-followup/supervisor.pid)" -o pid,ppid,sid,comm || true
            docker ps -a --filter name=groundcontrol-web --format '{{.ID}} {{.Status}} {{.Image}}'
            docker inspect groundcontrol-web --format '{{json .State}}' || true
            python3 -c 'import pathlib,json; p=pathlib.Path("/opt/groundcontrol/backups"); dirs=sorted(p.glob("supervised-*"),reverse=True); [print(str(d), (d/"result.json").read_text() if (d/"result.json").is_file() else "no result") for d in dirs[:2]]'
            curl -sS --max-time 5 -o /dev/null -w 'LOCAL_HTTP=%{http_code}\n' http://127.0.0.1:3003/api/vps/stats || true
