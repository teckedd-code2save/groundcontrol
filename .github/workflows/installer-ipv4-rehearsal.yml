name: Installer IPv4 443 rehearsal image
on:
  push:
    branches: ['rehearsal/installer-ipv4-443']
concurrency:
  group: gc-installer-ipv4-443-candidate
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: node --test scripts/check-start.cjs scripts/check-direct-ipv4-ingress.cjs
      - run: python3 scripts/test-check-direct-ipv4.py
      - run: bash -n scripts/start && bash -n scripts/install && bash -n scripts/direct-ipv4-ingress
      - run: cd scripts && sha256sum -c install.sha256 direct-ipv4-ingress.sha256
  publish-test-image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/teckedd-code2save/groundcontrol:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          case "$IMAGE_DIGEST" in sha256:*) ;; *) exit 1 ;; esac
          test "${#IMAGE_DIGEST}" -eq 71
          printf 'Source: %s\nImage: ghcr.io/teckedd-code2save/groundcontrol@%s\n' "$SOURCE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          sha256sum scripts/start scripts/install scripts/direct-ipv4-ingress >> "$GITHUB_STEP_SUMMARY"
