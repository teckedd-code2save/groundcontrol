name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- src/lib/repository-compose.test.ts src/lib/compose-source-host.test.ts src/lib/k8s/public-ip.test.ts src/lib/template-source.test.ts src/lib/template-preparation-retry.test.ts src/app/api/templates/deploy/route.test.ts src/lib/agent-creation-flow.test.ts
      - run: bash -n scripts/install
      - run: bash -n scripts/start
      - run: node --test scripts/check-start.cjs
      - run: python3 scripts/check-project-migrations.py
      - run: cd scripts && sha256sum -c install.sha256
      - run: npm run build
